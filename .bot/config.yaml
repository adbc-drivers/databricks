# Bug-fix task for adbc-drivers/databricks (C#). Copy to .bot/config.yaml.
# The engine (databricks-bot-engine) is INSTALLED by the workflow; this file is
# pure DATA. Single-repo: the agent edits THIS repo (TEST_REPO_ROOT = checkout)
# and the fix PR is opened here, anchored on the triggering issue.
name: csharp_bugfix
marker_namespace: engineer-bot-csharp-bugfix
branch_prefix: ai/bugfix-                 # fix branches: ai/bugfix-<issue-number>
bot_login_prefix: peco-engineer-bot       # <-- your engineer-bot App's login prefix

# safe_path denylist (relative to repo root). .git + the secret-scanner allowlist
# at minimum. NOTE (security): csharp/src is NOT denied — the agent must edit the
# code it fixes. `.bot` stays denied as defense-in-depth (the agent should never
# rewrite its own config/prompts). `.github` is INTENTIONALLY allowed (maintainer
# decision): the engineer-bot may need to fix its own CI/workflow wiring (e.g. a
# missing engine flag), and the human PR-review gate is the backstop — reviewers
# must scrutinize any `.github` diffs, since workflows carry secrets/tokens.
denied_subpaths:
  - .git
  - .gitleaksignore
  - .bot
  # csharp/hiveserver2 is a SEPARATE repo (git submodule -> adbc-drivers/hiveserver2).
  # Edits there cannot be committed to a parent-repo PR, so deny them. The author
  # prompt instructs the agent to STOP and report `blocked` (naming the hiveserver2
  # file/symbol) when a fix would require changing it — the issue-comment step then
  # posts that reason back to the issue.
  - csharp/hiveserver2

# The opened fix PR. publish is issue-driven, so {issue_number}/{issue_title}/{issue_url}
# are the TRIGGERING ISSUE's number/title/url (NOT a PR). "Fixes #" auto-closes
# the issue on merge.
pr_title_template: "fix(csharp): {issue_title} (#{issue_number})"
commit_message_template: "fix(csharp): address issue #{issue_number}"
pr_body_template: |-
  ## Summary

  Automated fix for [#{issue_number}]({issue_url}) — {issue_title}.

  {summary}

  ## Files changed
  {files_changed}

  ## Test plan
  {test_plan}

  Fixes #{issue_number}

  🤖 Generated by engineer-bot (bug-fix flow)

# Bash sandbox: an argv-PREFIX allowlist. PIN subcommands — a bare ("dotnet",)
# would allow `dotnet tool install`/`dotnet nuget add source`/`dotnet run
# --project /abs`. cat/ls deliberately ABSENT (they read arbitrary absolute
# paths); the agent uses read_file/glob/grep (safe_path-enforced).
bash_timeout: 1800
bash_allowlist:
  - [dotnet, build]
  - [dotnet, test]
  - [dotnet, restore]
  - [git, diff, HEAD]
  - [git, diff, --cached]
  - [git, status]

# Author phase: the user prompt is the convention template .bot/prompts/engineer/user.md
# (no config path — the engine discovers it); tokens are the ISSUE (the bug to fix).
# No driver PR, no SOURCE_PR_* — this is single-repo, issue-driven.
author:
  env_tokens:                 # {{issue_*}} in engineer/user.md  <-  env vars
    issue_number: ISSUE_NUMBER
    issue_title:  ISSUE_TITLE
    issue_body:   ISSUE_BODY
  # Legacy learning-log key. In distill mode (the `retrospective:` block below) the
  # engine ignores it for delivery: every bot session gets the matching lessons from
  # retrospective.lessons_path, and the conventions readers skip the archive, the
  # journal and the lessons file. Kept pointing at the frozen archive (log_path).
  knowledge_log: .claude/knowledge/learning.md

# Follow-up phase (engineer-bot-followup.yml): NO config block. The engine reads
# no `followup:` key — bot_config.py parses only `author:` + the shared top-level
# keys. The follow-up phase uses .bot/prompts/engineer-followup/system.md as its system
# prompt, builds its user prompt from the PR review thread (no user template), and
# reuses author.knowledge_log — so a `followup:` block here would be dead config.

# The bug-fix flow (engine: flows/bug_fix.py): the engine appends the
# "write a failing test → fix the CODE → re-run until green; don't weaken the
# test" instruction and forces a {outcome, reason, red_green_tests} result.
flow: bug-fix

# Daily-cron learning (retrospective flow, distill mode). Run by engineer-bot-learning.yaml
# via `python -m databricks_bot_engine.engineer_bot.retrospective`: over an adaptive
# look-back window the engine gathers merged PRs (diff, review history, commit
# messages), engineer-bot author-run logs, mistakes, run struggles and open bot-PR
# activity. Each run adds ONE new journal file and distills the journal into
# lessons_path, in ONE rolling learning PR. Every bot session then gets only the
# lessons that match its phase. Human-gated: never commits to main directly.
# Omitting this block makes the retrospective a no-op.
#
# No `system_prompt` override: the engine ships the authoritative batch-aware base
# (engineer_prompts.RETRO_SYSTEM_PROMPT). No `context_files` — the daily-cron engine
# enumerates its own sources via the GitHub API (context_files is an AUTHOR-phase key).
# branch_prefix here is the LEARNING branch prefix (distinct from the top-level
# `ai/bugfix-` fix-branch prefix); the rolling PR lands on the derived stable branch
# `ai/learning-pr`.
retrospective:
  log_mode: distill
  # Frozen archive of the old append-only log: never written, never injected. Its
  # durable rules were distilled by hand into lessons_path when this was switched on.
  log_path: .claude/knowledge/learning.md
  # Daily journal files (YYYY-MM-DD.md, YYYY-MM-DD-N.md). The learning-PR guard only
  # lets a learning PR ADD files here; existing files and log_path are frozen.
  journal_dir: .claude/knowledge/journal
  # The distilled lessons. Sessions get every lesson matching their phase and
  # language; untagged lessons are shared by every language.
  lessons_path: .claude/knowledge/lessons.md
  # Lesson tag keys besides phase. The distiller may use only these, and the
  # learning-PR guard rejects anything else. Each bot job declares its languages in
  # LESSONS_TAGS from the PR's changed paths or the issue's labels and title
  # (.github/scripts/lesson-tags.sh); an unclear session declares all three.
  # Route by phase and language only, never by finer areas.
  lesson_tags:
    lang: [csharp, go, rust]
  # Track C mistakes, plus run struggles and open bot-PR activity (Tracks D and E).
  mistake_inputs: [closed_unmerged, human_commits, needs_human, run_struggles, open_pr_activity]
  # Workflows the struggle tracks scan, besides the author workflow.
  struggle_workflows: [engineer-bot-followup.yml]
  # Off until the first distilled learning PR has been reviewed by a human.
  auto_merge_learning_pr: false
  branch_prefix: ai/learning-pr-            # rolling PR lands on the derived stable branch `ai/learning-pr`
  pr_label: engineer-bot-learning
  # The learning PR's title and commit subject. The PR-title check (adbc-drivers/dev
  # title_check.py) only accepts Conventional Commits types, so the engine default
  # `learn: ...` fails it.
  pr_title: "docs: retrospective learnings"
  author_workflow: engineer-bot.yaml        # Track B: which workflow's author runs to mine (NOTE: .yaml)

# ─── Reviewer bots (review / review-followup) — NOT configured here ──────────
# Documented for completeness (this file is the whole bot setup), but the reviewer
# reads NOTHING from .bot/config.yaml: the engine's bot_config.py parses only the
# `author:` block + the shared top-level keys above. Reviewer prompts are
# engine-owned; customize the reviewer via these (files/env — never config keys):
#   - prompt overrides — optional FILES read from the checkout:
#       .bot/prompts/review/system.md            (appended to the review prompt)
#       .bot/prompts/review-followup/system.md   (appended to the follow-up prompt)
#   - repo conventions — REPO_RULES_FILES env, set in reviewer-bot.yml / -followup.yml
#   - native skills    — REPO_SKILLS env, set in those same workflows
# Do NOT add a `review:` / `review_followup:` block here — the engine would ignore
# it (dead config), exactly like a `followup:` block.

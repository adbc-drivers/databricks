id = "GHSA-cmhx-cq75-c4mj"
ignoreUntil = 2027-02-18T00:00:00Z
reason = """System.Text.RegularExpressions 4.3.0 remains only in the arrow-adbc submodule's \
Apache.Arrow.Adbc.Client lockfile (netstandard2.0, via System.Data.Common 4.3.0), which this repo \
cannot change. The driver pins 4.3.1 directly. Remove once the submodule picks up a fixed version."""


# Existing findings in custom workflows are outside the workflow generation
# migration. Keep their behavior unchanged and address these findings separately.
# These exceptions apply only to the listed rules and files; generated workflows
# remain checked. Remove each exception when its underlying finding is fixed.
rules:
  adhoc-packages:
    ignore:
      - engineer-bot-followup.yml
      - engineer-bot-learning.yaml
      - engineer-bot.yaml
      - reviewer-bot-followup.yml
      - reviewer-bot.yml
  artipacked:
    ignore:
      - benchmarks.yml
      - csharp-sync-latest.yml
      - e2e-tests.yml
      - reyden-rest-nightly.yml
      - trigger-integration-tests.yml
  dangerous-triggers:
    ignore:
      - pr-validation.yml
      - rust_coverage_report.yaml
      - skip-checks-reporter.yml
  dependabot-cooldown:
    ignore:
      - dependabot.yaml
  excessive-permissions:
    ignore:
      - benchmarks.yml
      - e2e-tests.yml
      - pr-validation.yml
      - reyden-rest-nightly.yml
      - rust-e2e.yml
      - skip-checks-reporter.yml
      - trigger-integration-tests.yml
  github-app:
    ignore:
      - csharp-sync-latest.yml
      - engineer-bot-followup.yml
      - engineer-bot-learning.yaml
      - engineer-bot.yaml
      - reviewer-bot-followup.yml
      - reviewer-bot.yml
      - skip-checks-reporter.yml
      - trigger-integration-tests.yml
  template-injection:
    ignore:
      - benchmarks.yml
      - csharp-sync-latest.yml
      - e2e-tests.yml
      - engineer-bot-followup.yml
      - reviewer-bot-followup.yml
      - reyden-rest-nightly.yml
      - trigger-integration-tests.yml

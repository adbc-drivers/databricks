# Preserve existing workflow behavior while migrating Go workflow generation.
# Rust workflows retain their existing build tooling and are not regenerated.
# Exceptions apply only to the listed rules and files; all other checks remain
# enabled. Remove each exception when its underlying finding is fixed.
rules:
  adhoc-packages:
    ignore:
      - engineer-bot-followup.yml
      - engineer-bot-learning.yaml
      - engineer-bot.yaml
      - reviewer-bot-followup.yml
      - reviewer-bot.yml
  artipacked:
    ignore:
      - benchmarks.yml
      - csharp-sync-latest.yml
      - e2e-tests.yml
      - reyden-rest-nightly.yml
      - trigger-integration-tests.yml
  cache-poisoning:
    ignore:
      - rust_release.yaml
  dangerous-triggers:
    ignore:
      # Existing "take" handler assigns an issue without checking out PR code.
      - dev_issues.yaml
      - pr-validation.yml
      - rust_coverage_report.yaml
      - skip-checks-reporter.yml
  dependabot-cooldown:
    ignore:
      - dependabot.yaml
  excessive-permissions:
    ignore:
      - benchmarks.yml
      - e2e-tests.yml
      - pr-validation.yml
      - reyden-rest-nightly.yml
      - rust-e2e.yml
      - rust_release.yaml
      - rust_test.yaml
      - skip-checks-reporter.yml
      - trigger-integration-tests.yml
  github-app:
    ignore:
      - csharp-sync-latest.yml
      - engineer-bot-followup.yml
      - engineer-bot-learning.yaml
      - engineer-bot.yaml
      - reviewer-bot-followup.yml
      - reviewer-bot.yml
      - skip-checks-reporter.yml
      - trigger-integration-tests.yml
  template-injection:
    ignore:
      - benchmarks.yml
      - csharp-sync-latest.yml
      - e2e-tests.yml
      - engineer-bot-followup.yml
      - reviewer-bot-followup.yml
      - reyden-rest-nightly.yml
      - rust_release.yaml
      - rust_test.yaml
      - rust_test_pr.yaml
      - trigger-integration-tests.yml
  unpinned-uses:
    ignore:
      # Preserve the existing reusable Rust workflow reference to main.
      - rust_test_pr.yaml

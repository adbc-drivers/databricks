name: Sync C# release branches

# Runs whenever a commit lands on main that bumps the C# version.
# Keeps the release branch, version tag, and release/csharp/latest all in sync,
# and creates the GitHub Release for the version tag (mirroring the Go line).
on:
  push:
    branches:
      - main
    paths:
      - 'csharp/Directory.Build.props'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.INTEGRATION_TEST_APP_ID }}
          private-key: ${{ secrets.INTEGRATION_TEST_PRIVATE_KEY }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Parse version and derive names
        id: ver
        run: |
          VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' csharp/Directory.Build.props | head -n1)
          VERSION=$(printf '%s' "$VERSION" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not parse VersionPrefix from csharp/Directory.Build.props"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -qP '^\d+\.\d+\.\d+$'; then
            echo "ERROR: VersionPrefix must be in X.Y.Z format, got: '$VERSION'"
            exit 1
          fi
          MAJOR_MINOR=$(printf '%s' "$VERSION" | grep -oP '^\d+\.\d+')
          if [ -z "$MAJOR_MINOR" ]; then
            echo "ERROR: failed to derive major.minor from VersionPrefix: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION"                                        >> "$GITHUB_OUTPUT"
          echo "branch=release/csharp/v${MAJOR_MINOR}.latest"           >> "$GITHUB_OUTPUT"
          echo "tag=csharp/v${VERSION}"                                  >> "$GITHUB_OUTPUT"

      - name: Push main to release branch (create if new)
        run: |
          TARGET="${{ steps.ver.outputs.branch }}"
          if git ls-remote --exit-code origin "refs/heads/$TARGET" > /dev/null 2>&1; then
            echo "Updating existing branch: $TARGET"
          else
            echo "Creating new release branch: $TARGET"
          fi
          git push origin "HEAD:refs/heads/$TARGET"

      - name: Tag the release
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git ls-remote --exit-code origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag: $TAG"
          fi

      - name: Create GitHub Release
        # Mirrors the Go line's tag-triggered Release: a non-draft, non-prerelease
        # Release named after the version, with no attached package assets.
        # Gated on the Release (not the tag) so it is idempotent and can recover
        # if a previous run created the tag but failed to create the Release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
            exit 0
          fi

          DATE=$(grep -F "## [$VERSION]" csharp/CHANGELOG.md | head -n1 | sed -n -E 's/^## \[[^]]+\] - ([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/p')
          if [ -z "$DATE" ]; then
            # Sections historically sometimes say "Unreleased"; fall back to the
            # release date, like the Go release tool does.
            DATE=$(date -u +%F)
          fi

          BODY=$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' csharp/CHANGELOG.md | sed -e '/./,$!d')

          if [ -z "$BODY" ]; then
            echo "ERROR: csharp/CHANGELOG.md section for $VERSION is empty"
            exit 1
          fi

          gh release create "$TAG" \
            --title "ADBC Driver Foundry Driver for Databricks $VERSION ($DATE)" \
            --notes "$BODY"

      - name: Update release/csharp/latest
        run: |
          echo "Syncing release/csharp/latest → main"
          git push origin "HEAD:refs/heads/release/csharp/latest" --force

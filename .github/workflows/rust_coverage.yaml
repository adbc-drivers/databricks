# Maintained separately from the generated Rust Test workflow.
# rust_coverage_report.yaml consumes this workflow's rust-coverage artifact.
name: Rust Coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - "rust/**"
      - .github/workflows/rust_coverage.yaml
      - .github/workflows/rust_coverage_report.yaml

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  coverage:
    name: "Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          components: "llvm-tools-preview"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@735e5933943122c5ac182670a935f54a949265c1  # v2.52.4
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        working-directory: rust
        run: |
          cargo llvm-cov --locked --all-features \
            --ignore-filename-regex "tests/" \
            --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rust-coverage
          path: rust/lcov.info
          if-no-files-found: error
          retention-days: 1
